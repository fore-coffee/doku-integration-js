name: Publish Package

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

# Same publish steps as fore-coffee/devops-gh-workflows js-package-release.yml@v0.1.3,
# which fore-coffee/cache-manager-js calls, without its Slack notification. They are
# inlined because this repository is public and a public repository cannot call a
# reusable workflow that lives in a private one.
jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com/'
          scope: '@fore-coffee'

      - name: Set package.json version from tag
        run: |
          TAG=${GITHUB_REF##*/}
          VERSION=${TAG#v}
          echo "Using version: $VERSION"
          npm version --no-git-tag-version $VERSION

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish
