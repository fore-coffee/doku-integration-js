name: 🧪 Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# every run creates real VAs in the DOKU sandbox; a newer push makes the older run pointless
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # one job, one runner: unit and integration share a single checkout + npm ci
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    # a hung DOKU call would otherwise hold the run for GitHub's 360 minute default
    timeout-minutes: 10

    # the secrets are scoped to the two steps that need them (not the whole job), so
    # checkout, setup-node and npm ci never see them

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # no install scripts are needed on Linux, and none should ever see the secrets
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # no secrets, so forks and dependabot get it too
      # only _test/units: the older suites in _test/ have 51 known upstream failures
      - name: Run unit tests
        run: npm run test:unit

      # the suite skips itself without DOKU_CLIENT_ID, which would pass green having tested nothing
      # forks and dependabot run without the DOKU secrets, so the integration steps skip for them
      # runs only after unit tests pass, so a unit failure fails the job without hitting DOKU
      - name: Require DOKU secrets
        id: secrets
        if: >-
          github.event_name != 'pull_request' || (
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.actor != 'dependabot[bot]'
          )
        env:
          DOKU_CLIENT_ID: ${{ secrets.DOKU_CLIENT_ID }}
          DOKU_SECRET_KEY: ${{ secrets.DOKU_SECRET_KEY }}
          DOKU_PRIVATE_KEY: ${{ secrets.DOKU_PRIVATE_KEY }}
          DOKU_PUBLIC_KEY: ${{ secrets.DOKU_PUBLIC_KEY }}
          DOKU_PUBLIC_KEY_DOKU: ${{ secrets.DOKU_PUBLIC_KEY_DOKU }}
          DOKU_ISSUER: ${{ secrets.DOKU_ISSUER }}
          DOKU_PARTNER_SERVICE_ID: ${{ secrets.DOKU_PARTNER_SERVICE_ID }}
          DOKU_CUSTOMER_NO: ${{ secrets.DOKU_CUSTOMER_NO }}
        run: |
          missing=""
          for name in DOKU_CLIENT_ID DOKU_SECRET_KEY DOKU_PRIVATE_KEY DOKU_PUBLIC_KEY DOKU_PUBLIC_KEY_DOKU DOKU_ISSUER DOKU_PARTNER_SERVICE_ID DOKU_CUSTOMER_NO; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing"
            exit 1
          fi

      # skipped for forks and dependabot, since the secrets check is skipped for them
      - name: Run integration tests
        if: steps.secrets.outcome == 'success'
        env:
          DOKU_CLIENT_ID: ${{ secrets.DOKU_CLIENT_ID }}
          DOKU_SECRET_KEY: ${{ secrets.DOKU_SECRET_KEY }}
          DOKU_PRIVATE_KEY: ${{ secrets.DOKU_PRIVATE_KEY }}
          DOKU_PUBLIC_KEY: ${{ secrets.DOKU_PUBLIC_KEY }}
          DOKU_PUBLIC_KEY_DOKU: ${{ secrets.DOKU_PUBLIC_KEY_DOKU }}
          DOKU_ISSUER: ${{ secrets.DOKU_ISSUER }}
          DOKU_PARTNER_SERVICE_ID: ${{ secrets.DOKU_PARTNER_SERVICE_ID }}
          DOKU_CUSTOMER_NO: ${{ secrets.DOKU_CUSTOMER_NO }}
        run: npm run test:integration
