name: 🧪 Publish PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

# one preview at a time per PR; a newer push makes the older one pointless
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: 🚀 Publish Preview
    runs-on: ubuntu-latest

    # forks and dependabot run without the publish secret, so there is nothing to publish with
    # TEST ONLY: never publish
    if: false

    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - name: Resolve preview version
        id: version
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # a fixed 0.0.0 base puts a preview below every real release that exists or ever will,
          # and keeps this independent of whatever release-drafter happens to have in draft
          echo "version=0.0.0-preview-$PR-${SHA:0:7}" >> "$GITHUB_OUTPUT"

          # an npm version has to be semver, so `pr-78-7308f64` can never be one. It is a
          # dist-tag instead, which is what makes `npm i <pkg>@pr-78-7308f64` resolve.
          echo "tag=pr-$PR-${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://npm.pkg.github.com/"
          scope: "@fore-coffee"

      - name: Set package.json version
        run: npm version --no-git-tag-version "${{ steps.version.outputs.version }}"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # any dist-tag other than `latest` keeps real releases in front for a plain `npm i`
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --tag "${{ steps.version.outputs.tag }}"

      - name: Comment install instructions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          # every push leaves its own comment; the marker is how cleanup finds them all later
          MARKER='<!-- pr-preview-release -->'
          BODY=$(printf '%s\n' \
            "$MARKER" \
            "### 🧪 Preview published" \
            "" \
            "Commit \`${SHA:0:7}\` is published:" \
            "" \
            '```bash' \
            "npm i @fore-coffee/doku-integration-js-cleanup-test@$TAG" \
            '```' \
            "" \
            "Resolves to version \`$VERSION\`. A plain \`npm i\` still gets real releases.")

          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$BODY" --silent
